name: Backend CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: podigger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d podigger"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv pip install --system -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py migrate --noinput
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: podigger
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DJANGO_SECRET_KEY: ci-only-secret
      - run: pytest
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: podigger
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DJANGO_SECRET_KEY: ci-only-secret
          HYPOTHESIS_MAX_EXAMPLES: 20

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  request-deploy:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: perna/podigger-infra
          event-type: application-image-published
          client-payload: >-
            {"service":"backend","environment":"${{ github.ref_name == 'main' && 'production' || 'staging' }}","image":"ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"}
